name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Собираем сайт явным allowlist-списком.
      # ВАЖНО: assets/, poster-studio/, content/, css/, js/ публикуются полностью —
      # poster-studio нужен слайду 19 (iframe) и финальному слайду (ссылка).
      # Служебное в артефакт не попадает: .github, .agents, .zcode, .claude,
      # *.md, skills-lock.json. (У actions/upload-pages-artifact нет инпута
      # ignore-paths — прежний блок исключений молча игнорировался GitHub Actions.)
      - name: Assemble site directory
        run: |
          mkdir -p _site
          for item in index.html css js content poster-studio assets; do
            if [ -e "$item" ]; then
              cp -R "$item" _site/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4